name: Harness Baseline v1

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify declared contract
        id: verify
        continue-on-error: true
        env:
          OCP_RUN_ID: RUN-GITHUB-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run verify
      - name: Upload evidence bundle
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocp-harness-${{ github.run_id }}
          path: .ocp/evidence/runs
          if-no-files-found: warn
          retention-days: 30
      - name: Generate external verification attestation
        if: always()
        continue-on-error: true
        env:
          OCP_ATTESTATION_SUBJECT_SHA: ${{ github.sha }}
          OCP_SOURCE_HEAD_REF: ${{ github.head_ref || github.ref_name }}
          OCP_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OCP_SOURCE_BASE_REF: ${{ github.base_ref }}
          OCP_SOURCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          OCP_EVIDENCE_RUN_ID: RUN-GITHUB-${{ github.run_id }}-${{ github.run_attempt }}
          OCP_VERIFICATION_OUTCOME: ${{ steps.verify.outcome }}
          OCP_PRIMARY_EVIDENCE_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          OCP_PRIMARY_EVIDENCE_ARTIFACT_NAME: ocp-harness-${{ github.run_id }}
          OCP_PRIMARY_EVIDENCE_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
          OCP_PRIMARY_EVIDENCE_ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: node scripts/create-verification-attestation.mjs
      - name: Upload verification attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocp-attestation-${{ github.run_id }}
          path: .ocp/attestations/runs
          if-no-files-found: error
          retention-days: 90
      - name: Preserve verification failure
        if: always() && steps.verify.outcome != 'success'
        run: exit 1
