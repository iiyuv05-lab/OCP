name: OCP editable workspace acceptance
on:
  push:
    branches: ['implementation/ocp-v81-editable-20260917']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ocp-v81-editable
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Semantic tests
        run: mkdir -p .studio-evidence; node --test tests/studio/*.test.mjs 2>&1 | tee .studio-evidence/semantic.log
      - name: Lint
        run: npm run lint 2>&1 | tee .studio-evidence/lint.log
      - name: Existing native build and source regressions
        run: npm test 2>&1 | tee .studio-evidence/native-baseline.log
      - name: Exact native runtime types
        run: |
          npx wrangler types worker-configuration.d.ts --config dist/server/wrangler.json
          npx tsc --noEmit 2>&1 | tee .studio-evidence/types.log
      - run: npx playwright install --with-deps chromium
      - name: Real editable browser workflow
        run: node tests/studio/editable-browser.mjs 2>&1 | tee .studio-evidence/editable.log
      - name: Existing native Worker and D1 R2 runtime
        run: node tests/studio/native-runtime.mjs 2>&1 | tee .studio-evidence/native-runtime.log
      - name: Published Plmag editor and standalone file
        run: node tests/studio/hosted-editable.mjs 2>&1 | tee .studio-evidence/published.log
      - name: Preserve exact source and evidence
        if: always()
        run: |
          mkdir -p /tmp/ocp-v81-result
          git archive --format=tar HEAD | gzip > /tmp/ocp-v81-result/source.tar.gz
          git rev-parse HEAD > /tmp/ocp-v81-result/revision.txt
          cp -r .studio-evidence /tmp/ocp-v81-result/evidence || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocp-v81-editable-evidence
          path: /tmp/ocp-v81-result
          retention-days: 14
