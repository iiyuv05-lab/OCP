<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Brain Universe · 공개 예시</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080f1b;color:#e8f0fa;font:14px/1.6 system-ui,sans-serif}header{display:flex;align-items:center;gap:20px;padding:18px 24px;border-bottom:1px solid #26354b}h1{font-size:21px;margin:0}small,p{color:#9bafc9}header small{margin-left:auto}button,input,select,textarea{font:inherit;color:inherit;background:#132238;border:1px solid #2e4663;border-radius:6px;padding:8px 11px}button{cursor:pointer}button:hover,button.active{background:#2b4664}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #9acefb;outline-offset:3px}main{display:grid;grid-template-columns:minmax(330px,1fr) 310px;min-height:calc(100vh - 72px)}section{padding:22px;min-width:0}aside{padding:22px;border-left:1px solid #26354b;background:#0c1625;overflow-wrap:anywhere}.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.bar input{flex:1;min-width:130px}.bar button{font-size:12px}.stats{border-block:1px solid #26354b;padding:12px 0;margin:10px 0 16px;color:#9bafc9}.map{height:500px;border:1px solid #26354b;border-radius:10px;background:radial-gradient(ellipse at 45% 50%,#17335e77,transparent 65%),#080f1b;overflow:hidden}svg{width:100%;height:100%}.unit{cursor:pointer;outline:none}.unit:hover circle,.unit:focus circle{stroke-width:3}.unit text{font-size:12px;fill:#e8f0fa;paint-order:stroke;stroke:#08101b;stroke-width:4px;pointer-events:none}.unit .small{font-size:9px;fill:#a3b6d0}.rel{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #26354b;background:transparent;border-radius:0;font-size:12px}.notice{font-size:11px;color:#a3b6d0;border-left:2px solid #cfba86;padding-left:11px}.tools{display:grid;gap:8px}.tools button{font-size:12px}.table{max-height:500px;overflow:auto}.table button{display:block;width:100%;text-align:left;border-radius:0;background:transparent;border:0;border-bottom:1px solid #26354b;padding:12px}dialog{background:#102038;color:#e8f0fa;border:1px solid #557598;border-radius:10px;padding:24px;width:min(460px,93vw)}dialog::backdrop{background:#000b}dialog h2{font-size:19px;margin:0}dialog form,dialog label{display:grid;gap:8px}dialog form{gap:13px}textarea{min-height:90px}dialog .end{display:flex;gap:7px;justify-content:flex-end}#status{font-size:11px;color:#a3b6d0;margin-top:15px}footer{padding:14px 24px;font-size:11px;color:#8da3bf;border-top:1px solid #26354b}@media(max-width:750px){main{display:block}aside{border-left:0;border-top:1px solid #26354b}header{padding:15px;gap:10px}header small{font-size:9px}section{padding:16px}.map{height:430px}.bar button{padding:6px}.unit text{font-size:13px}}
</style></head><body><header><h1>✧ Brain Universe</h1><small>공개 합성 데모 · 실제 볼트 아님</small></header><main><section><div class="bar"><input id="search" aria-label="개체 검색" placeholder="아이디어 · 모듈 · 해결할 문제"><select id="filter" aria-label="진영"><option value="all">전체 진영</option><option value="terran">테란 · 보유</option><option value="zerg">저그 · 문제</option><option value="protoss">프로토스 · 외부</option><option value="neutral">관찰자</option></select></div><div class="bar"><button data-view="cosmos">우주 지도</button><button data-view="tactical">전략 지도</button><button data-view="list">목록</button><button id="add">개체 추가</button><button id="link">관계 연결</button><button id="export">JSON 내보내기</button></div><div id="stats" class="stats"></div><div id="view"></div><div id="status" role="status">세션 메모리 · 원본/서버 저장과 무관</div><p class="notice">배치는 보기용입니다. 질량·중력·시장 규모·공전·자전의 실측값은 없습니다. 점선은 관계 제안입니다.</p></section><aside id="detail" aria-label="선택한 개체"></aside></main><footer>원본 수정·삭제·네트워크 전송·AI 자동 실행 없음. 외부 해결책 도입은 후보를 만드는 동작이며 실제 설치가 아닙니다. 전체 구현 계약: docs/BRAIN-UNIVERSE-HANDOFF.md.</footer><dialog id="dialog"><div id="form"></div></dialog><script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const factions={terran:['테란 · 보유','#80c5ed'],zerg:['저그 · 문제','#d79ad1'],protoss:['프로토스 · 외부','#e8d397'],neutral:['관찰자','#b4c5dd']};
const kinds={idea:'아이디어',asset:'어셋',module:'모듈',issue:'문제',solution:'외부 해결책',person:'관찰자'};const relations={contains:'포함',references:'참조',candidate:'해결 후보',adoption:'도입 후보',related:'연결'};
let seq=8,selected='observer',mode='cosmos';const nodes=[{id:'observer',name:'나 · 관찰자',kind:'person',faction:'neutral',description:'지구는 기록된 나, 빛은 관찰자의 탐색 방향입니다.'},{id:'idea',name:'연결된 지식 지도',kind:'idea',faction:'terran',description:'출처와 함께 보유한 아이디어의 합성 예시입니다.'},{id:'asset',name:'시각 어셋 묶음',kind:'asset',faction:'terran',description:'원본 게임 어셋을 사용하지 않는 독자적 기호입니다.'},{id:'module',name:'문서 연결 모듈',kind:'module',faction:'terran',description:'자료와 참조를 연결하는 내부 모듈 예시입니다.'},{id:'issue',name:'문서 연결 누락',kind:'issue',faction:'zerg',description:'실제 장애 보고가 아닌 합성 예시입니다. 해결 후보를 연결해 보세요.'},{id:'collision',name:'같은 이름 충돌',kind:'issue',faction:'zerg',description:'이름이 같다는 이유만으로 같은 개체로 병합하지 않습니다.'},{id:'solution',name:'외부 링크 진단 도구',kind:'solution',faction:'protoss',description:'도입하면 외부 원본은 남고 내부 모듈 후보가 새로 생깁니다.'},{id:'method',name:'관계 설계 방법론',kind:'solution',faction:'protoss',description:'외부 해결책이 더 참이거나 우월하다는 의미는 아닙니다.'}];const edges=[{from:'observer',to:'idea',type:'related'},{from:'idea',to:'module',type:'related'},{from:'module',to:'asset',type:'references'},{from:'solution',to:'issue',type:'candidate'},{from:'method',to:'collision',type:'candidate'}];const logs=[];nodes.forEach(n=>{n.state='fixture';n.work='open'});edges.forEach(e=>e.state='proposal');
const find=id=>nodes.find(n=>n.id===id);function record(action,target){logs.push({at:new Date().toISOString(),action,target});$('#status').textContent='로컬 기록 추가 · 원본/서버는 변경하지 않았습니다.'}function close(){$('#dialog').close()}function modal(html){$('#form').innerHTML=html;$('#dialog').showModal();setTimeout(()=>$('#form input,#form select,#form textarea')?.focus(),0)}const buttons='<div class="end"><button type="button" data-close>취소</button><button type="submit">로컬 기록</button></div>';const options=ns=>ns.map(n=>`<option value="${esc(n.id)}">${esc(n.name)}</option>`).join('');
function render(){const f=$('#filter').value,q=$('#search').value.toLowerCase(),visible=nodes.filter(n=>(f==='all'||n.faction===f)&&(n.name+' '+n.description).toLowerCase().includes(q)),ids=new Set(visible.map(n=>n.id)),ee=edges.filter(e=>ids.has(e.from)&&ids.has(e.to));$('#stats').textContent=`표시 ${visible.length}개 · 연결 ${ee.length}개 · 열린 문제 ${visible.filter(n=>n.kind==='issue'&&n.work!=='resolved').length}개 · 모든 초기 데이터는 합성 예시`;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===mode));if(mode==='list')$('#view').innerHTML='<div class="table">'+visible.map(n=>`<button data-id="${esc(n.id)}">${esc(n.name)} <small>· ${kinds[n.kind]} / ${factions[n.faction][0]}</small></button>`).join('')+'</div>';else{const pos=new Map;visible.slice(0,150).forEach((n,i)=>{if(mode==='tactical'){const col=Object.keys(factions).indexOf(n.faction),row=visible.filter(x=>x.faction===n.faction).indexOf(n);pos.set(n.id,{x:110+col*220,y:120+row*85})}else{const angle=i*2.39996323,r=80+Math.sqrt(i)*54;pos.set(n.id,{x:450+Math.cos(angle)*r,y:250+Math.sin(angle)*r*.65})}});let content='<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8" fill="#91a9c8"/></marker></defs>';if(mode==='tactical')Object.values(factions).forEach((v,i)=>content+=`<text x="${35+i*220}" y="50" fill="${v[1]}" font-size="13">${v[0]}</text>`);else content+='<ellipse cx="450" cy="250" rx="295" ry="180" fill="none" stroke="#334c70" stroke-dasharray="2 9"/><ellipse cx="450" cy="250" rx="180" ry="115" fill="none" stroke="#2a405b"/>';ee.forEach(e=>{const a=pos.get(e.from),b=pos.get(e.to);if(a&&b)content+=`<path d="M${a.x} ${a.y}L${b.x} ${b.y}" stroke="#6985a8" opacity=".55" stroke-dasharray="4 6" marker-end="url(#arrow)"/>`});visible.slice(0,150).forEach(n=>{const p=pos.get(n.id),c=factions[n.faction][1],shape=n.faction==='protoss'?`<path d="M0 -18L13 0 0 18 -13 0Z" fill="#4b432f" stroke="${c}"/>`:n.faction==='zerg'?`<path d="M0 -18L5 -7 16 -10 10 0 17 9 5 8 0 18 -6 8 -17 10 -11 0 -16 -10 -5 -7Z" fill="#49324c" stroke="${c}"/>`:n.faction==='terran'?`<path d="M-10 -14H10L16 -5V7L8 14H-8L-16 7V-5Z" fill="#203c52" stroke="${c}"/><path d="M-6 -6H6V6H-6Z" fill="${c}"/>`:`<circle r="16" fill="#294961" stroke="${c}"/><ellipse rx="23" ry="7" fill="none" stroke="${c}" transform="rotate(-25)"/>`;content+=`<g class="unit" role="button" tabindex="0" aria-label="${esc(n.name)}" data-id="${esc(n.id)}" transform="translate(${p.x} ${p.y})"><circle r="29" fill="transparent" stroke="${selected===n.id?'#aad4f5':'none'}" stroke-dasharray="4 4"/>${shape}<text y="39" text-anchor="middle">${esc(n.name.length>18?n.name.slice(0,17)+'…':n.name)}</text><text class="small" y="55" text-anchor="middle">${kinds[n.kind]} · ${n.state==='fixture'?'합성 예시':'로컬 제안'}</text></g>`});$('#view').innerHTML='<div class="map"><svg viewBox="0 0 900 500" aria-label="데이터 지도">'+content+'</svg></div>'+(visible.length>150?'<small>지도는 150개까지 표시합니다. 전체는 목록을 이용하세요.</small>':'')}const n=find(selected);if(!n)return;$('#detail').innerHTML=`<small>SELECTED OBJECT</small><h2>${esc(n.name)}</h2><p>${kinds[n.kind]} · ${factions[n.faction][0]}</p><p>${esc(n.description)}</p><p class="notice">질량·중력·주기: 미측정<br>상태: ${n.work==='resolved'?'사용자의 해결 기록':n.state==='fixture'?'합성 예시':'로컬 제안'}</p><h3>연결</h3>${edges.filter(e=>[e.from,e.to].includes(n.id)).map(e=>{const a=find(e.from===n.id?e.to:e.from);return `<button class="rel" data-id="${esc(a.id)}">${e.from===n.id?'↗':'↙'} ${esc(a.name)} · ${relations[e.type]}</button>`}).join('')||'<small>연결 없음</small>'}<div class="tools" style="margin-top:20px">${n.kind==='issue'?'<button id="resolve">해결 검증 기록</button>':''}${n.faction==='protoss'?'<button id="adopt">내부 모듈 도입 후보 만들기</button>':''}</div>${n.evidence?'<h3>기록한 검증 근거</h3><p>'+esc(n.evidence)+'</p>':''}`}
function add(){modal(`<h2>개체 추가</h2><p>이 세션에만 기록합니다.</p><form id="addForm"><label>이름<input name="name" required maxlength="150"></label><label>종류<select name="kind">${Object.entries(kinds).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>설명<textarea name="description" maxlength="3000"></textarea></label>${buttons}</form>`);$('#addForm').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(!v.name.trim())return;const n={id:'local-'+(++seq),...v,name:v.name.trim(),faction:({issue:'zerg',solution:'protoss',person:'neutral'})[v.kind]||'terran',state:'proposal',work:'open'};nodes.push(n);selected=n.id;$('#filter').value='all';$('#search').value='';record('개체 추가',n.id);close();render()}}
function link(){modal(`<h2>관계 제안</h2><form id="linkForm"><label>출발<select name="from">${options(nodes)}</select></label><label>관계<select name="type">${Object.entries(relations).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>도착<select name="to">${options(nodes)}</select></label><small id="linkError"></small>${buttons}</form>`);$('#linkForm [name=from]').value=selected;$('#linkForm [name=to]').value=nodes.find(n=>n.id!==selected).id;$('#linkForm').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(v.from===v.to||edges.some(a=>a.from===v.from&&a.to===v.to&&a.type===v.type)){$('#linkError').textContent='같은 개체 또는 중복 관계입니다.';return}edges.push({...v,state:'proposal'});record('관계 제안',v.from);close();render()}}
function resolve(){const n=find(selected);modal(`<h2>해결 검증 기록</h2><p>자동 검증이 아니라 사용자의 근거 기록입니다. 문제 원문과 이력은 남습니다.</p><form id="resolveForm"><label>상태<select name="work"><option value="resolved">해결 확인 기록</option><option value="open">다시 열기</option></select></label><label>검증 조건·결과<textarea name="evidence" required minlength="15" maxlength="5000"></textarea></label>${buttons}</form>`);$('#resolveForm').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(v.evidence.trim().length<15)return;n.work=v.work;n.evidence=v.evidence;record('검증 기록: '+v.evidence,n.id);close();render()}}
function adopt(){const old=find(selected);const n={id:'local-'+(++seq),name:old.name+' 도입 후보',description:'외부 원본 '+old.name+'의 내부 도입 후보. 실제 설치·실행은 하지 않았습니다.',kind:'module',faction:'terran',state:'proposal',work:'candidate'};nodes.push(n);edges.push({from:old.id,to:n.id,type:'adoption',state:'proposal'});selected=n.id;$('#filter').value='all';$('#search').value='';record('도입 후보 생성',n.id);render()}
function backup(){const b=new Blob([JSON.stringify({version:1,type:'brain-universe-public-starter',nodes,edges,logs},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='Brain-Universe-public-starter.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-id]');if(!b)return;if(b.hasAttribute('data-close'))return close();if(b.dataset.id){selected=b.dataset.id;render();return}if(b.dataset.view){mode=b.dataset.view;render();return}({add,link,resolve,adopt,export:backup})[b.id]?.()});document.addEventListener('keydown',e=>{if(e.target.matches('.unit')&&['Enter',' '].includes(e.key)){e.preventDefault();selected=e.target.dataset.id;render()}});$('#search').oninput=render;$('#filter').onchange=render;render();
</script></body></html>
